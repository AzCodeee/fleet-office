<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 text-gray-700">

<div x-data="{ sidebar:false }" class="min-h-screen bg-gray-100">
    <!-- MOBILE OVERLAY -->
    <div x-show="sidebar" @click="sidebar=false"
         class="fixed inset-0 bg-black/40 z-40 lg:hidden"></div>

    <!-- SIDEBAR -->
    <aside :class="sidebar ? 'translate-x-0' : '-translate-x-full'"
           class="fixed lg:translate-x-0 transition-transform z-50 w-64 h-screen bg-gray-100 border-r">

        <div class="p-4 border-b flex justify-between items-center">
            <a href="https://azcodeee.github.io/fleet-office/">
                <img src="assets/images/logo.png" class="h-16" alt="Logo">
            </a>
            <button class="lg:hidden" @click="sidebar=false">✕</button>
        </div>

        <nav class="p-2 space-y-1">
            <a href="dashboard.html"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white hover:shadow transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>

            <a href="user-listing.html"
               class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white shadow font-medium">
                <i data-lucide="users" class="w-5 h-5"></i>
                Users
            </a>

            <a href="role.html"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white hover:shadow">
                <i data-lucide="shield" class="w-5 h-5"></i>
                Roles
            </a>

        </nav>
    </aside>

    <div class="lg:ml-64 min-h-screen">

        <!-- HEADER -->
        <header class="fixed top-0 right-0 left-0 lg:left-64
               h-16 bg-white border-b border-gray-200
               flex items-center justify-between px-4 lg:px-6 z-30">

            <div class="flex items-center gap-3">

                <!-- MOBILE MENU -->
                <button class="lg:hidden"
                        @click="sidebar=true">

                    <i data-lucide="menu" class="w-6 h-6"></i>

                </button>

                <h1 class="text-sm lg:text-lg font-semibold uppercase">
                    Fleet Management System
                </h1>

            </div>

            <!-- PROFILE DROPDOWN -->
            <div x-data="{ open: false }" class="relative">

                <!-- TRIGGER -->
                <button @click="open = !open"
                        class="flex items-center gap-3 focus:outline-none">

                    <img src="assets/images/avatar-2.jpg"
                        class="w-10 h-10 rounded-full border" />

                    <div class="text-sm text-left">
                        <div class="font-medium">Aaron Chia</div>
                        <div class="text-gray-500 text-xs">aaron@gmail.com</div>
                    </div>

                </button>

                <!-- DROPDOWN -->
                <div x-show="open"
                    @click.away="open = false"
                    x-transition
                    class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">

                    <!-- PROFILE -->
                    <a href="profile.html"
                    class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-100">

                        <i data-lucide="user-circle" class="w-4 h-4"></i>
                        Profile
                    </a>

                    <!-- DIVIDER -->
                    <div class="border-t"></div>

                    <!-- LOGOUT -->
                    <a href="logout.html"
                    class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50">

                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        Logout
                    </a>

                </div>

            </div>

        </header>

        <!-- CONTENT -->
        <main class="pt-20 p-6" x-data="{ open: false }">

            <!-- TITLE -->
            <div class="flex justify-between items-center mb-4">

                <div>
                    <h2 class="text-xl font-semibold">User Management</h2>
                    <p class="text-sm text-gray-500">Manage user accounts & permissions</p>
                </div>

                <button @click="open = true"
                        class="bg-green-600 text-white px-3 py-2 text-sm lg:px-4 lg:text-base rounded-lg hover:bg-green-700">
                    + Add Users
                </button>

            </div>

            <!-- TABLE -->
            <div class="bg-white rounded-xl shadow">

                <!-- SEARCH -->
                <div class="p-4 border-b flex justify-end">
                    <input type="text"
                           placeholder="Search user..."
                           class="border rounded-lg px-3 py-2 w-64">
                </div>

                <div class="overflow-x-auto">

                <table class="w-full text-sm">

                    <thead class="bg-gray-50 text-left">
                        <tr>
                            <th class="p-3">Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-right p-3">Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr class="border-t hover:bg-gray-50">
                            <td class="p-3 font-medium">admin01</td>
                            <td>admin@azcode.com</td>
                            <td>System Administrator</td>
                            <td>
                                <span class="px-2 py-1 text-xs rounded bg-green-100 text-green-700 font-medium">
                                    Active
                                </span>
                            </td>

                            <td class="text-right p-3">
                                <a href="user-view.html"
                                   class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-gray-100 hover:bg-white hover:shadow">

                                    <i data-lucide="eye" class="w-4 h-4"></i>

                                </a>
                            </td>
                        </tr>

                        <tr class="border-t hover:bg-gray-50">
                            <td class="p-3 font-medium">john.driver</td>
                            <td>john@fleet.com</td>
                            <td>Driver</td>
                            <td>
                                <span class="px-2 py-1 text-xs rounded bg-red-100 text-red-700 font-medium">
                                    Inactive
                                </span>
                            </td>

                            <td class="text-right p-3">
                                <a href="user-view.html"
                                   class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-gray-100 hover:bg-white hover:shadow">

                                    <i data-lucide="eye" class="w-4 h-4"></i>

                                </a>
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>

            <!-- OFFCANVAS -->
            <div x-show="open"
                x-transition
                class="fixed inset-0 flex justify-end bg-black/40 z-50">

                <div @click.away="open = false"
                    class="w-full max-w-md bg-white h-screen shadow-xl flex flex-col">

                    <!-- HEADER -->
                    <div class="flex justify-between items-center p-6 border-b">

                        <h2 class="text-lg font-semibold">
                            Add User
                        </h2>

                        <button @click="open = false"
                                class="text-gray-500 hover:text-black">
                            ✕
                        </button>

                    </div>

                    <!-- BODY -->
                    <div class="flex-1 overflow-y-auto p-6">

                        <form class="space-y-4">

                            <!-- USERNAME -->
                            <div>
                                <label class="text-sm font-medium">Username</label>
                                <input type="text"
                                    class="w-full border rounded-lg px-3 py-2 mt-1"
                                    placeholder="Enter username">
                            </div>

                            <!-- EMAIL -->
                            <div>
                                <label class="text-sm font-medium">Email</label>
                                <input type="email"
                                    class="w-full border rounded-lg px-3 py-2 mt-1"
                                    placeholder="Enter email">
                            </div>

                            <!-- PASSWORD -->
                            <div>
                                <label class="text-sm font-medium">Password</label>
                                <input type="password"
                                    class="w-full border rounded-lg px-3 py-2 mt-1"
                                    placeholder="Enter password">
                            </div>

                            <!-- ROLE -->
                            <div x-data="roleSelect()" class="relative">
                                <label class="text-sm font-medium">Role</label>

                                <!-- SELECT BOX -->
                                <button type="button"
                                        @click="open = !open"
                                        class="w-full border rounded-lg px-3 py-2 mt-1 text-left bg-white flex justify-between items-center">

                                    <span class="text-gray-600">
                                        Select Roles
                                    </span>

                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>

                                </button>

                                <!-- DROPDOWN -->
                                <div x-show="open"
                                    @click.away="open = false"
                                    class="absolute z-50 w-full mt-1 bg-white border rounded-lg shadow max-h-48 overflow-auto">

                                    <template x-for="role in roles" :key="role.id">

                                        <label class="flex items-center gap-2 px-3 py-2 hover:bg-gray-100 cursor-pointer">

                                            <input type="checkbox"
                                                :value="role.id"
                                                x-model.number="selected">

                                            <span x-text="role.name"></span>

                                        </label>

                                    </template>

                                </div>

                                <!-- SELECTED TAGS -->
                                <div class="flex flex-wrap gap-2 mt-2">

                                    <template x-for="id in selected" :key="id">

                                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs flex items-center gap-1">

                                            <span x-text="getName(id)"></span>

                                            <button type="button"
                                                    @click="remove(id)"
                                                    class="text-blue-700 hover:text-red-500">
                                                ✕
                                            </button>

                                        </span>

                                    </template>

                                </div>

                            </div>

                            <!-- STATUS -->
                            <div>
                                <label class="text-sm font-medium">Status</label>
                                <select class="w-full border rounded-lg px-3 py-2 mt-1">

                                    <option>Active</option>
                                    <option>Inactive</option>

                                </select>
                            </div>

                        </form>

                    </div>

                    <!-- FOOTER -->
                    <div class="border-t p-6 flex justify-end gap-2">

                        <button type="button"
                                @click="open = false"
                                class="px-4 py-2 border rounded-lg hover:bg-gray-100">

                            Cancel

                        </button>

                        <button class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">

                            Save User

                        </button>

                    </div>

                </div>

            </div>

        </main>
    </div>
</div>

<script>
lucide.createIcons();
</script>
<script>
function roleSelect() {
    return {
        open: false,

        roles: [
            { id: 1, name: 'System Administrator' },
            { id: 2, name: 'Fleet Manager' },
            { id: 3, name: 'Maintenance Manager' },
            { id: 4, name: 'Workshop Supervisor' },
            { id: 5, name: 'Mechanic' },
            { id: 6, name: 'Storekeeper' },
            { id: 7, name: 'Project Manager' },
            { id: 8, name: 'Driver' },
            { id: 9, name: 'Equipment Operator' },
            { id: 10, name: 'Senior Management' }
        ],

        selected: [],

        getName(id) {
            return this.roles.find(r => r.id === id)?.name ?? '';
        },

        remove(id) {
            this.selected = this.selected.filter(i => i !== id);
        }
    }
}
</script>
</body>
</html>

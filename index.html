<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>

<body class="bg-gray-100 text-gray-700">

<!-- TOP BAR -->
<header class="h-16 bg-white border-b flex items-center px-6 justify-between">
    <div class="flex items-center gap-3">
        <!-- MOBILE MENU -->
        <button class="lg:hidden"
                @click="sidebar=true">

            <i data-lucide="menu" class="w-6 h-6"></i>

        </button>

        <h1 class="text-sm lg:text-lg font-semibold uppercase">
            Fleet Management System
        </h1>

    </div>

    <!-- PROFILE DROPDOWN -->
    <div x-data="{ open: false }" class="relative">

        <!-- TRIGGER -->
        <button @click="open = !open"
                class="flex items-center gap-3 focus:outline-none">

            <img src="assets/images/avatar-2.jpg"
                class="w-10 h-10 rounded-full border" />

            <div class="text-sm text-left">
                <div class="font-medium">Aaron Chia</div>
                <div class="text-gray-500 text-xs">aaron@gmail.com</div>
            </div>

        </button>

        <!-- DROPDOWN -->
        <div x-show="open"
            @click.away="open = false"
            x-transition
            class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">

            <!-- PROFILE -->
            <a href="profile.html"
            class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-100">

                <i data-lucide="user-circle" class="w-4 h-4"></i>
                Profile
            </a>

            <!-- DIVIDER -->
            <div class="border-t"></div>

            <!-- LOGOUT -->
            <a href="logout.html"
            class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50">

                <i data-lucide="log-out" class="w-4 h-4"></i>
                Logout
            </a>

        </div>

    </div>
</header>

<!-- CONTENT -->
<main class="p-6">

    <h2 class="text-xl font-semibold mb-6">Modules</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- LORRY MODULE -->
        <a href="https://azcodeee.github.io/lorry-ui/index.html"
           class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition flex items-center gap-4">

            <div class="p-3 bg-blue-100 rounded-lg">
                <i data-lucide="truck" class="w-6 h-6 text-blue-600"></i>
            </div>

            <div>
                <h3 class="font-semibold text-lg">Lorry Module</h3>
                <p class="text-sm text-gray-500">Manage fleet, maintenance & vehicles</p>
            </div>

        </a>

        <!-- USER MODULE (FUTURE) -->
        <a href="dashboard.html"
        class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition flex items-center gap-4">

            <div class="p-3 bg-green-100 rounded-lg">
                <i data-lucide="users" class="w-6 h-6 text-green-600"></i>
            </div>

            <div>
                <h3 class="font-semibold text-lg">User Management</h3>
                <p class="text-sm text-gray-500">
                    Manage system users, assign roles, and control access permissions
                </p>
            </div>

        </a>

    </div>

</main>

<script>
    lucide.createIcons();
</script>

</body>
</html>
